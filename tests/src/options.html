<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="optionsDocumentTitle">TabbySelect Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <main class="panel">
    <header class="panel-header">
      <h1 data-i18n="actionDefaultTitle">TabbySelect</h1>
    </header>

    <section class="area" aria-labelledby="settings-title">
      <h2 id="settings-title" class="area-title area-title-subtle" data-i18n="settingsSectionTitle">Settings</h2>

      <section class="section" aria-labelledby="url-settings-title">
        <h3 id="url-settings-title" class="section-title" data-i18n="urlSettingsTitle">Enabled URL settings</h3>

        <p class="description" data-i18n="urlDescription">
          Enable the extension only on pages matching the patterns below. Enter one pattern per line; * matches any text. Leave this empty to enable the extension on all URLs.
        </p>

        <textarea id="urlAllowPatterns" data-i18n-placeholder="urlPlaceholder" placeholder="Example:
https://example.com/*
https://*.example.org/forms/*"></textarea>
      </section>

      <div id="status" class="status" aria-live="polite"></div>
    </section>

  </main>

  <script src="shared.js"></script>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>

</html>
