name: Deploy support site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tabbyselect-pages-cutover
  cancel-in-progress: false
jobs:
  deploy:
    uses: apricotpersonallabo/site-platform/.github/workflows/pages-deploy.yml@503eb3c738c93f1df9feda2115f75833e53e33de
    with:
      site-directory: site
      deploy-enabled: true
