name: Test browser extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  site-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: apricotpersonallabo/site-platform
          ref: 503eb3c738c93f1df9feda2115f75833e53e33de
          path: .site-platform-host
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix .site-platform-host
      - run: npx playwright install --with-deps chromium
      - run: node .site-platform-host/src/build.mjs --site site --out site-dist --production
      - run: node .site-platform-host/src/check.mjs site-dist
      - name: Test migrated Playground with the installed extension
        env:
          SITE_PLATFORM_PATH: .site-platform-host
        run: npx playwright test --config playwright.site.config.js
