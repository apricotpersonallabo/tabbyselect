name: Site preview

on:
  pull_request:
    paths:
      - "site/**"
      - "src/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/site-preview.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    uses: apricotpersonallabo/site-platform/.github/workflows/site-preview.yml@503eb3c738c93f1df9feda2115f75833e53e33de
    with:
      site-directory: site
      artifact-name: tabbyselect-site-preview
